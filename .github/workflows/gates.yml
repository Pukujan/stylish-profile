name: gates

# Single required status check for the protected default branch.
# Context reported to branch protection is exactly "gates" (this job's id/name).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PCM_PIN: 4e2385474b4af9249ca009cbdcb38c4498932475
  CGM_PIN: c069613ca8b3e02bcf5aba1960160583537f8a3a
  # Pinned to the versions the dark GIFs were assembled with. The check is a
  # byte comparison, and Pillow's GIF encoder is not stable across releases, so
  # an unpinned install would let a runner-image bump red the gate on files
  # nobody changed.
  PILLOW_PIN: "12.3.0"
  NUMPY_PIN: "1.26.4"
  SCIPY_PIN: "1.15.3"

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned continuity CLI
        run: pip install --disable-pip-version-check "git+https://github.com/Pukujan/project-continuity-modules@${PCM_PIN}"

      - name: Fetch pinned content helper
        run: |
          git clone --quiet --filter=blob:none https://github.com/Pukujan/content-generation-modules.git "$RUNNER_TEMP/cgm"
          git -C "$RUNNER_TEMP/cgm" checkout --quiet "${CGM_PIN}"

      - name: Continuity records validate
        run: continuity validate --root .

      - name: Content adapter conformance
        run: |
          python "$RUNNER_TEMP/cgm/scripts/validate_content_system.py" \
            --root "$RUNNER_TEMP/cgm" \
            --adapter "$PWD/.content-system" \
            --project-root "$PWD"

      - name: Always-on writing contract
        run: python "$RUNNER_TEMP/cgm/scripts/verify_hsw_applied.py" --root "$RUNNER_TEMP/cgm"

      - name: Tour page writing scan
        run: |
          python "$RUNNER_TEMP/cgm/scripts/verify_hsw_applied.py" \
            --root "$RUNNER_TEMP/cgm" \
            --mode acs-html \
            --html docs/index.html

      - name: Profile links resolve
        run: python scripts/check_profile_links.py

      # The clips are committed binaries, so nothing else in the suite would
      # notice if one were replaced while the recorded transcript stayed put.
      # This compares each committed file against its recorded byte count, its
      # manifest SHA-256, and the text it claims to say.
      - name: Voice notes match their record
        run: python scripts/generate_voice_notes.py --check

      # The dark copies are derived from the light illustrations rather than
      # drawn, so a regenerated light picture leaves its dark twin behind and
      # the page shows one wrong image among nine. Re-deriving is deterministic,
      # which makes a byte comparison a real test. scipy is needed for the
      # connected-component pass that finds the paper.
      - name: Dark variants match their source
        run: |
          pip install --disable-pip-version-check \
            "pillow==${PILLOW_PIN}" "numpy==${NUMPY_PIN}" "scipy==${SCIPY_PIN}"
          python scripts/derive_dark_assets.py --check

      # The rebuilt figures are composited from one locked plate, so the
      # environment is identical in every frame by construction. This compares
      # each committed GIF's frames outside the moving boxes its recipe
      # declares and fails when anything else drifts - the regression the
      # owner reported, where the whole picture warped frame to frame.
      - name: Animation environments stay locked
        run: |
          pip install --disable-pip-version-check \
            "pillow==${PILLOW_PIN}" "numpy==${NUMPY_PIN}" "scipy==${SCIPY_PIN}"
          for recipe in scripts/motion-recipes/*.json; do
            python scripts/build_locked_motion.py check --recipe "$recipe"
          done
