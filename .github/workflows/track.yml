name: track-activity

# On-demand regeneration of the profile page's activity block, plus a refresh
# after pushes that change the tracker, the pages, or the content system they
# draw on.
#
# There is deliberately no `schedule:` trigger. A pull request opened with the
# workflow's `GITHUB_TOKEN` has its `pull_request` runs held for approval, by
# design, so a scheduled run here would leave a pull request sitting blocked
# until someone approved the run. The daily refresh runs from the workstation
# instead (scripts/refresh_profile.ps1), where the owner's authenticated
# credentials carry the ruleset's admin bypass and the push lands directly.
# Dispatch this workflow to regenerate on demand; it commits to one fixed
# branch and opens a pull request for review.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".content-system/**"
      - "profile/**"
      - "scripts/track_activity.py"

permissions:
  contents: write
  pull-requests: write

env:
  PCM_PIN: 4e2385474b4af9249ca009cbdcb38c4498932475

jobs:
  track:
    name: track
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: track-activity
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned continuity CLI
        run: pip install --disable-pip-version-check "git+https://github.com/Pukujan/project-continuity-modules@${PCM_PIN}"

      - name: Refresh activity data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/track_activity.py --root .

      - name: Re-render the continuity index
        # The refresh rewrites two files that the continuity document index
        # pins by hash, so the index has to be re-rendered in the same commit
        # or the required gates check fails on a stale index. Rendering does
        # not mark the documents reviewed; they keep their NEEDS_REVIEW state.
        run: continuity docs render --root .

      - name: Profile links resolve
        run: python scripts/check_profile_links.py

      - name: Commit and open a refresh pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: auto/activity-refresh
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Refresh the activity block"
          git push --force origin "$BRANCH"

          open_pr() {
            gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
              --json number --jq '.[0].number // empty'
          }

          pr=$(open_pr)
          if [ -z "$pr" ]; then
            # No open refresh pull request. A previously closed one cannot be
            # reopened once its branch was deleted, so open a fresh one.
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "Refresh the activity block" \
              --body "Regenerated from the GitHub API by \`scripts/track_activity.py\`. The numbers in the tracking block and the four generated charts are the only files that changed." \
              || true
            pr=$(open_pr)
          fi

          if [ -z "$pr" ]; then
            echo "could not find or open a refresh pull request" >&2
            exit 1
          fi

          echo "refresh pull request is #$pr"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --squash

      - name: Mirror the page to the profile repository
        # github.com/Pukujan renders Pukujan/Pukujan's README, so the published
        # page has to be copied there. That repository is not this one, so the
        # job needs a token that can write to it. When PROFILE_SYNC_TOKEN is
        # absent the step says so and the run still succeeds: the numbers on the
        # page live in the generated charts, which the profile page loads from
        # this repository by raw URL, so only the prose rows go stale until the
        # mirror runs again.
        env:
          SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
          MIRROR_REPO: Pukujan/Pukujan
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "PROFILE_SYNC_TOKEN is not set; skipping the mirror step."
            echo "Add a fine-grained token with write access to $MIRROR_REPO to enable it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --quiet --depth 1 \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${MIRROR_REPO}.git" "$RUNNER_TEMP/mirror"
          cp profile/README.md "$RUNNER_TEMP/mirror/README.md"
          if [ -z "$(git -C "$RUNNER_TEMP/mirror" status --porcelain)" ]; then
            echo "mirror already current"
            exit 0
          fi
          git -C "$RUNNER_TEMP/mirror" add README.md
          git -C "$RUNNER_TEMP/mirror" commit -m "Sync the profile page"
          git -C "$RUNNER_TEMP/mirror" push origin HEAD:main
